name: Deploy Documentation

# The site deploys at release, through the Release workflow's call below, or on
# manual dispatch; ordinary pushes to main do not touch Pages. The Release
# workflow passes the bump commit as `ref`, and a dispatch renders the latest
# version tag. Pull requests render the site as a check, without deploying.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # CHANGELOG.md is part of the site through docs/changelog.qmd.
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit or ref to build, defaulting to the latest version tag."
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  pages:
    name: Documentation
    uses: mcanouil/quarto-workflows/.github/workflows/pages.yml@v2
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      ref: ${{ inputs.ref }}
