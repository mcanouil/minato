name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: "Version bump, applied when 'Create release' is ticked"
        default: "minor"
        options:
          - "patch"
          - "minor"
          - "major"
      create_release:
        type: boolean
        description: "Bump the version, tag, build binaries, and create a release"
        default: true
      deploy_pages:
        type: boolean
        description: "Deploy the documentation to GitHub Pages"
        default: true

permissions:
  contents: read

# Serialise releases and never cancel one in flight: aborting midway could
# leave the bump merged but the tag and release absent.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Check before releasing
    if: ${{ inputs.create_release || inputs.deploy_pages }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --all-targets

      - name: Test
        run: cargo test --locked

  bump-version:
    name: Bump version
    needs: validate
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    outputs:
      version: ${{ steps.bump.outputs.version }}
      commit_sha: ${{ steps.land.outputs.sha }}

    steps:
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}

      # The lock file keeps its own record of the version, so it follows the
      # bump, or a release commit leaves the tree dirty on the next build.
      - name: Bump the version
        id: bump
        uses: mcanouil/release-actions/bump@v1
        with:
          bump: ${{ inputs.version }}
          token: ${{ steps.token.outputs.token }}
          targets: |
            - file: Cargo.toml
              pattern: '^version = "{version}"$'
              source: true
            - file: CITATION.cff
              pattern: '^version: {version}$'
            - file: CITATION.cff
              pattern: '^date-released: "{date}"$'
          after-bump: cargo update --workspace --offline || cargo update --workspace

      # Skip CI on the squash-merged bump: the validate job already tests and
      # lints the tree before the release, so a second CI run on the push to
      # main would be redundant.
      - name: Land the bump
        id: land
        uses: mcanouil/release-actions/land@v1
        with:
          mode: pull-request
          files: ${{ steps.bump.outputs.files }}
          version: ${{ steps.bump.outputs.version }}
          message: "ci: bump version to ${{ steps.bump.outputs.version }} :rocket: [skip ci]"
          branch: ci/bump-version
          token: ${{ steps.token.outputs.token }}

  build:
    name: Build ${{ matrix.target }}
    needs: bump-version
    if: ${{ inputs.create_release }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Attesting build provenance needs an OIDC token and write access to the
      # attestations store, so anyone can later verify where a binary came from.
      id-token: write
      attestations: write

    steps:
      # Build the bump commit rather than the triggering ref, which still
      # carries the previous version number.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.commit_sha }}

      - name: Install the toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # A musl target links its C dependency (ring's crypto) with musl-gcc.
      # Both Linux runners are already the target architecture, so this is a
      # native build, not a cross-compile.
      - name: Install musl tools
        if: ${{ endsWith(matrix.target, '-musl') }}
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.bump-version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p release_assets
          NAME="minato-${VERSION}-${TARGET}"

          # The archive holds the binary alone, at its root, so the installer can
          # extract straight to a directory on PATH. The README, licence, and
          # changelog live on the release page and in the repository.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            (cd "target/${TARGET}/release" && 7z a "${GITHUB_WORKSPACE}/release_assets/${NAME}.zip" minato.exe >/dev/null)
          else
            tar --create --gzip --file "release_assets/${NAME}.tar.gz" -C "target/${TARGET}/release" minato
          fi

      # Lets anyone run `gh attestation verify` and learn which workflow and
      # which commit produced the archive in front of them.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release_assets/*.tar.gz
            release_assets/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: minato-${{ matrix.target }}
          path: release_assets/*
          if-no-files-found: error

  github-release:
    name: Create the release
    needs: [bump-version, build]
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      VERSION: ${{ needs.bump-version.outputs.version }}

    steps:
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.commit_sha }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Compute checksums
        shell: bash
        run: |
          set -euo pipefail
          # Bare filenames, so the installer can match a downloaded asset by name.
          (cd dist && sha256sum minato-*.tar.gz minato-*.zip > SHA256SUMS)
          cat dist/SHA256SUMS

      # What changed comes from the changelog rather than from commit subjects,
      # because the changelog is written for the reader. The install
      # instructions live in a committed template, which ends with the
      # "## Changes" heading the section goes under.
      - name: Compose the release body
        id: notes
        uses: mcanouil/release-actions/notes@v1
        with:
          version: ${{ env.VERSION }}
          header: .github/release-notes.md
          section-heading: ""

      - name: Release on GitHub
        uses: mcanouil/release-actions/release@v1
        with:
          version: ${{ env.VERSION }}
          body-file: ${{ steps.notes.outputs.body-file }}
          target: ${{ needs.bump-version.outputs.commit_sha }}
          assets: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          token: ${{ steps.token.outputs.token }}

  pages:
    name: Deploy the documentation
    needs: [validate, bump-version, github-release]
    if: >-
      ${{ always()
        && needs.validate.result == 'success'
        && needs.bump-version.result != 'failure' && needs.bump-version.result != 'cancelled'
        && needs.github-release.result != 'failure' && needs.github-release.result != 'cancelled'
        && inputs.deploy_pages }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    # Build the bump commit rather than the triggering ref: the latter still
    # says "Unreleased" in the changelog, so the published site would not show
    # the version that was just released. Empty on a deploy-only run.
    with:
      ref: ${{ needs.bump-version.outputs.commit_sha }}
