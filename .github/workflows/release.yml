name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: "Version bump, applied when 'Create release' is ticked"
        default: "minor"
        options:
          - "patch"
          - "minor"
          - "major"
      create_release:
        type: boolean
        description: "Bump the version, tag, build binaries, and create a release"
        default: true
      deploy_pages:
        type: boolean
        description: "Deploy the documentation to GitHub Pages"
        default: true

permissions:
  contents: read

# Serialise releases and never cancel one in flight: aborting midway could
# leave the bump merged but the tag and release absent.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Check before releasing
    if: ${{ inputs.create_release || inputs.deploy_pages }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --all-targets

      - name: Test
        run: cargo test --locked

  bump-version:
    name: Bump version
    needs: validate
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      BRANCH: ci/bump-version
      BUMP: ${{ inputs.version }}

    outputs:
      version: ${{ steps.bump.outputs.version }}
      commit_sha: ${{ steps.bump.outputs.commit_sha }}
      pr_url: ${{ steps.bump.outputs.pr_url }}

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up git identity
        uses: ./.github/actions/setup-git-user
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - name: Compute the next version and update sources
        id: bump
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT=$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT}"
          case "${BUMP}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "::error::Unknown bump: ${BUMP}"; exit 1 ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          DATE=$(date -u +%Y-%m-%d)

          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            git push origin --delete "${BRANCH}"
          fi
          git checkout -b "${BRANCH}"

          sed -E -i '0,/^version[[:space:]]*=/s/^(version[[:space:]]*=[[:space:]]*")[^"]+/\1'"${VERSION}"'/' Cargo.toml
          sed -E -i 's/^(version:[[:space:]]*).*/\1'"${VERSION}"'/' CITATION.cff
          sed -E -i 's/^(date-released:[[:space:]]*).*/\1"'"${DATE}"'"/' CITATION.cff
          sed -i "s/^## \[Unreleased\]/## ${VERSION} (${DATE})/" CHANGELOG.md

          # Keep the lockfile's own record of the version in step, so that a
          # release commit does not leave the tree dirty on the next build.
          cargo update --workspace --offline || cargo update --workspace

          git add Cargo.toml Cargo.lock CITATION.cff CHANGELOG.md
          # Skip CI on the squash-merged bump: the build job already tests and
          # lints the bump commit before the release, so a second CI run on the
          # push to main would be redundant. The marker carries into the squash
          # commit message, which is what the push event inspects.
          git commit -m "ci: bump version to ${VERSION} :rocket:" -m "[skip ci]"
          git push --force origin "${BRANCH}"

          sleep 5
          PR_URL=$(gh pr create \
            --fill-first \
            --base "${GITHUB_REF_NAME}" \
            --head "${BRANCH}" \
            --label "Type: CI/CD :robot:")

          sleep 5
          merged=false
          for attempt in {1..10}; do
            if gh pr merge --squash --delete-branch "${BRANCH}"; then
              merged=true
              break
            fi
            echo "Bump pull request not mergeable yet (attempt ${attempt}/10); retrying in 6s."
            sleep 6
          done
          if [ "${merged}" != "true" ]; then
            echo "::error::Could not merge the bump pull request ${PR_URL}."
            exit 1
          fi

          COMMIT_SHA=""
          for attempt in {1..10}; do
            COMMIT_SHA=$(gh pr view "${PR_URL}" --json mergeCommit --jq '.mergeCommit.oid // empty')
            [ -n "${COMMIT_SHA}" ] && break
            sleep 3
          done
          if [ -z "${COMMIT_SHA}" ]; then
            echo "::error::Could not resolve the merge commit for ${PR_URL}."
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "commit_sha=${COMMIT_SHA}"
            echo "pr_url=${PR_URL}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    needs: bump-version
    if: ${{ inputs.create_release }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Attesting build provenance needs an OIDC token and write access to the
      # attestations store, so anyone can later verify where a binary came from.
      id-token: write
      attestations: write

    steps:
      # Build the bump commit rather than the triggering ref, which still
      # carries the previous version number.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.commit_sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # A musl target links its C dependency (ring's crypto) with musl-gcc.
      # Both Linux runners are already the target architecture, so this is a
      # native build, not a cross-compile.
      - name: Install musl tools
        if: ${{ endsWith(matrix.target, '-musl') }}
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.bump-version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p release_assets
          NAME="minato-${VERSION}-${TARGET}"

          # The archive holds the binary alone, at its root, so the installer can
          # extract straight to a directory on PATH. The README, licence, and
          # changelog live on the release page and in the repository.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            (cd "target/${TARGET}/release" && 7z a "${GITHUB_WORKSPACE}/release_assets/${NAME}.zip" minato.exe >/dev/null)
          else
            tar --create --gzip --file "release_assets/${NAME}.tar.gz" -C "target/${TARGET}/release" minato
          fi

      # Lets anyone run `gh attestation verify` and learn which workflow and
      # which commit produced the archive in front of them.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release_assets/*.tar.gz
            release_assets/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: minato-${{ matrix.target }}
          path: release_assets/*
          if-no-files-found: error

  github-release:
    name: Create the release
    needs: [bump-version, build]
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      VERSION: ${{ needs.bump-version.outputs.version }}

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.commit_sha }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Compute checksums
        shell: bash
        run: |
          set -euo pipefail
          # Bare filenames, so the installer can match a downloaded asset by name.
          (cd dist && sha256sum minato-*.tar.gz minato-*.zip > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Assemble the release notes
        shell: bash
        run: |
          set -euo pipefail

          # What changed comes from the changelog rather than from commit
          # subjects, because the changelog is written for the reader.
          awk -v heading="## ${VERSION}" '
            index($0, heading) == 1 { flag = 1; next }
            /^## / && flag { flag = 0 }
            flag
          ' CHANGELOG.md | sed '/./,$!d' > changes.md

          if [ ! -s changes.md ]; then
            echo "::error::No changelog entry found for ${VERSION}."
            exit 1
          fi

          # The install instructions live in a committed template, so the
          # release body and the site stay in step. It ends with the "## Changes"
          # heading, under which the changelog section is appended.
          sed "s/%%VERSION%%/${VERSION}/g" .github/release-notes.md > notes.md
          cat changes.md >> notes.md

      - name: Create the GitHub release
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${VERSION}" \
            --target "${{ needs.bump-version.outputs.commit_sha }}" \
            --title "${VERSION}" \
            --notes-file notes.md \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
          echo "url=$(gh release view "${VERSION}" --json url --jq .url)" >> "${GITHUB_OUTPUT}"

      - name: Summary
        shell: bash
        env:
          URL: ${{ steps.release.outputs.url }}
        run: |
          {
            echo "## Release"
            echo
            echo "- Tag: \`${VERSION}\`"
            echo "- Release: ${URL}"
            echo "- Assets: five platform archives, each carrying the binary alone, plus SHA256SUMS."
          } >> "${GITHUB_STEP_SUMMARY}"

  pages:
    name: Deploy the documentation
    needs: [validate, bump-version, github-release]
    if: >-
      ${{ always()
        && needs.validate.result == 'success'
        && needs.bump-version.result != 'failure' && needs.bump-version.result != 'cancelled'
        && needs.github-release.result != 'failure' && needs.github-release.result != 'cancelled'
        && inputs.deploy_pages }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    # Build the bump commit rather than the triggering ref: the latter still
    # says "Unreleased" in the changelog, so the published site would not show
    # the version that was just released. Empty on a deploy-only run.
    with:
      ref: ${{ needs.bump-version.outputs.commit_sha }}
