name: Documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Render website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render
        run: quarto render docs --output-dir _site

      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/_site
          if-no-files-found: error

# Deployment to GitHub Pages is intentionally not wired up yet.
# The repository is private, and Pages on a private repository requires a paid
# plan. The render job above still runs on every pull request, so the site is
# verified continuously. Add a deploy job using actions/deploy-pages once the
# repository is public.
