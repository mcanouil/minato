name: Documentation check

# Deploying to Pages is the Deploy Documentation workflow's job. This one only
# checks that a change still renders, before it reaches main.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # CHANGELOG.md is part of the site through docs/changelog.qmd.
    paths: ["docs/**", "CHANGELOG.md", ".github/workflows/docs.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Render website
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft != true }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render
        run: quarto render docs

      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/_site
          if-no-files-found: error
