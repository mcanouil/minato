name: Bug report
description: Report an error or unexpected behaviour
labels:
  - "Type: Bug :bug:"

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

  - type: checkboxes
    attributes:
      label: Before reporting
      options:
        - label: I have searched the issue tracker for similar issues.
          required: true

  - type: textarea
    attributes:
      label: Bug description
      description: What went wrong, in a sentence or two.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: |
        The commands you ran, and how your remotes or configuration were set up.
      placeholder: |
        1. `minato ...`
        2. ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behaviour
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual behaviour
      description: What happened instead, including any error output.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment
      description: |
        Run `minato --version` and `git --version`, and note your operating system.
        `minato` shells out to `git`, so the `git` version and how your remotes are configured are often relevant.
      placeholder: |
        - minato: 0.1.0
        - git: 2.45.0
        - OS: macOS 15.0 | Windows 11 | Ubuntu 24.04
    validations:
      required: true

  - type: markdown
    attributes:
      value: "_Thanks for submitting this bug report!_"
