[package]
name = "fleet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Overview and sync of Git repositories across hosting providers"
repository = "https://github.com/mcanouil/fleet"
license = "MIT"
authors = ["Mickaël Canouil"]
keywords = ["git", "github", "repository", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.2", features = ["derive"] }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
toml = "1.1.3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dev-dependencies]
tempfile = "3.27.0"
