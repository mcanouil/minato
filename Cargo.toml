[package]
name = "fleet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Overview and sync of Git repositories across hosting providers"
repository = "https://github.com/mcanouil/fleet"
license = "MIT"
authors = ["Mickaël Canouil"]
keywords = ["git", "github", "repository", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.2", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
