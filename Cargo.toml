[package]
name = "minato"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Overview and sync of Git repositories across hosting providers"
repository = "https://github.com/mcanouil/minato"
license = "MIT"
authors = ["Mickaël Canouil"]
keywords = ["git", "github", "repository", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
clap_complete = "4.6.8"
jiff = { version = "0.2.33", features = ["serde"] }
ratatui = "0.30.2"
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dev-dependencies]
clap-markdown = "0.1.5"
proptest = "1.11.0"
serde_json = "1.0.150"
tempfile = "3.27.0"
wiremock = "0.6.5"
