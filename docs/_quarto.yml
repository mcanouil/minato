project:
  # Names the atelier extension, which contributes the website project type and
  # the defaults that go with it, including `format: atelier-html`.
  type: atelier
  resources:
    - assets/images/
    - favicon.ico
    - site.webmanifest
    # Published verbatim so `curl -fsSL .../install.sh | bash` and
    # `irm .../install.ps1 | iex` work.
    - install.sh
    - install.ps1

website:
  title: "Minato"
  description: "Overview and sync of Git repositories across hosting providers."
  site-url: &site-url "https://m.canouil.dev/minato"
  repo-url: "https://github.com/mcanouil/minato"
  favicon: favicon.ico
  image: /assets/images/og-image.png
  image-alt: &image-alt >-
    The Minato mark, a teal harbour wall open to the north-east with an amber
    mooring at its centre, on a rounded pale tile beside the name Minato and
    the line "A harbour for your repositories", against deep harbour blue.
  twitter-card:
    image-alt: *image-alt

  navbar:
    title: "Minato"
    left:
      - text: "{{< iconify octicon:rocket-16 aria-hidden='true' >}} Get started"
        href: get-started/index.qmd
        aria-label: "Get started"
      - text: "{{< iconify octicon:terminal-16 aria-hidden='true' >}} Commands"
        href: reference/index.qmd
        aria-label: "Commands"
      - text: "{{< iconify octicon:light-bulb-16 aria-hidden='true' >}} Design"
        href: design.qmd
        aria-label: "Design"
      - text: "{{< iconify octicon:history-16 aria-hidden='true' >}} Changelog"
        href: changelog.qmd
        aria-label: "Changelog"
    right:
      # Replaced at load by the gitlink extension's navbar widget: a button
      # showing live star and fork counts and a repository menu.
      - text: "{{< iconify octicon:mark-github-16 title='GitHub' label='GitHub' >}}"
        href: "#gitlink-widget"
        aria-label: "GitHub"

  page-footer:
    left: |
      Powered by [{{< iconify simple-icons:quarto aria-hidden='true' >}} Quarto](https://quarto.org).
    center: |
      &copy; []{#current-year} [Mickaël CANOUIL](https://mickael.canouil.fr). [{{< iconify octicon:heart-fill-16 aria-hidden='true' >}} Sponsor](https://github.com/sponsors/mcanouil?o=esb).
    right: |
      Licence: [MIT](https://github.com/mcanouil/minato?tab=MIT-1-ov-file#readme).

brand: _brand.yml

format:
  # The atelier extension carries the house style and the shared behaviour;
  # only what is minato's own is set here. Its theme list is `brand` plus the
  # extension's own stylesheet, and Quarto concatenates lists across levels, so
  # naming a sheet here layers it on top rather than replacing them.
  atelier-html:
    theme:
      light: &theme
        - assets/stylesheets/theme.scss
      dark: *theme

filters:
  - at: pre-quarto
    path: code-window
  - at: post-quarto
    path: gitlink

extensions:
  atelier:
    # The filter builds `og:url` and the canonical link from this, and Quarto
    # builds the sitemap from `website.site-url`; the anchor keeps them equal.
    site-url: *site-url
    # Site-root-relative, with the leading slash Quarto needs in order to
    # rewrite each href to the page's own offset.
    icon: /assets/images/icon.svg
    apple-touch-icon: /assets/images/apple-touch-icon.png
    manifest: /site.webmanifest
  gitlink:
    # Widget only: the platform and repository come from `website.repo-url`,
    # and in-text reference rewriting stays off.
    enabled: false
    widget:
      enabled: true
      extra-links:
        - text: "Ideas"
          href: "/discussions/categories/ideas"
          icon: discussion
        - text: "Q&A"
          href: "/discussions/categories/q-a"
          icon: question
      sponsor: mcanouil
      style-navbar-tools: true
  code-window:
    style: "macos"
    # Blocks here are either a command to run or the output it produced, and
    # both are labelled explicitly, so a language-derived label would only add
    # noise.
    auto-filename: false
